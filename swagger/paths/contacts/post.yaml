tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
            minLength: 3
            maxLength: 20
          phoneNumber:
            description: 'Contact`s phone number'
            type: string
            example: '1231231234'
            pattern: '^[0-9]{10,15}$'
          email:
            description: 'Contact`s email'
            type: string
            example: 'alex34@gmail.com'
            format: email
          isFavourite:
            description: 'Whether the contact is favorite or not'
            type: boolean
            example: false
          contactType:
            description: 'Contact`s type'
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: 'Contact`s photo'
            type: string
            format: binary
responses:
  '201':
    description: 'Successfully created a contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
