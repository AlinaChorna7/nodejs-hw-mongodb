tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: 'Update contact with payload'
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: 'ID of the contact to update'
    schema:
      type: string
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - isFavourite
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: 'Contact`s phone number'
            type: string
            example: '123123123'
          email:
            description: 'Contact`s email'
            type: string
            example: 'alex34@gmail.com'
          isFavourite:
            description: 'Whether the contact is favorite or not'
            type: boolean
            example: false
          contactType:
            description: 'Contact`s type'
            type: string
            enum: ['work', 'home', 'personal']
responses:
  '201':
    description: Updates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully updated a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
