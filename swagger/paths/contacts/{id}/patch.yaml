tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: 'Update contact with payload'
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: 'ID of the contact to update'
    schema:
      type: string
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
            minLength: 3
            maxLength: 30
          phoneNumber:
            description: 'Contact`s phone number'
            type: string
            example: '1231231234'
            pattern: '^[0-9]{10,15}$'
          email:
            description: 'Contact`s email'
            type: string
            example: 'alex34@gmail.com'
            format: email
          isFavourite:
            description: 'Whether the contact is favorite or not'
            type: boolean
            example: false
          contactType:
            description: 'Contact`s type'
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: 'Contact`s photo'
            type: string
            format: binary
responses:
  '200':
    description: 'Successfully updated a contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    description: 'Contact not found'
